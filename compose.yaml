services:
  backend-server:
    container_name: Portfolio-Back-end
    build: 
      context: https://github.com/KaioFelps/portfolio-backend.git#main
    image: portfolio-backend
    env_file:
      - .env
    environment:
      - PORT=80
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      - DIRECT_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
    ports:
      - ${BACKEND_PORT}:80
    depends_on:
      - db
    networks:
      - app
    
  db:
    container_name: Portfolio-DB
    image: postgres
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app

networks:
  app: