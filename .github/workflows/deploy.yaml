name: Nextjs deploy to square cloud

on:
  push:
    branches: 
      - main
 
concurrency:
  group: ci-deploy-$j{{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APPLICATION_URL: ${{ vars.NEXT_PUBLIC_APPLICATION_URL }}
      NEXT_PUBLIC_APPLICATION_NAME: ${{ vars.NEXT_PUBLIC_APPLICATION_NAME }}
      NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm
        
      - name: Make scripts executable
        run: chmod u+x ./scripts/*
      
      - name: Build the app
        run: ./scripts/build.sh

      - name: Setup Square Cloud CLI
        run: curl -fsSL https://cli.squarecloud.app/install | bash

      - name: Commit to Square Cloud
        run: |
          cd __package
          squarecloud auth login --token=${{ secrets.SQUARE_TOKEN }}
          squarecloud app commit -r ${{ secrets.SQUARE_APP_ID }}
